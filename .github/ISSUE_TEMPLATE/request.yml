name: Request
description: Request a feature, additional data, or a change to the census pipeline/output
labels: [request]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the census :)
        To report a wrong (or confirm a correct) result for a specific prefix, use the **Data issue** form instead.
  - type: dropdown
    id: kind
    attributes:
      label: What are you requesting?
      options:
        - Additional target (hitlist) source
        - Additional column or data in the output
        - Fix or change in the data output
        - Fix or change in the LACeS pipeline
        - Feature for census_helper.py or the published files
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use case
      description: What would you use it for, or what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source details
      description: For a new data source, where it is available, how often it is updated, and its license or terms of use.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
