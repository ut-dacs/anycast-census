<p>Daily IP anycast censuses (IPv4 /24, IPv6 /48) by <a href="https://doi.org/10.1145/3730567.3764484">LACeS</a>, since 21 March 2024.</p>
<p>Each <code>census-YYYY-MM.zip</code> holds one month of census files from
<a href="https://github.com/ut-dacs/anycast-census">ut-dacs/anycast-census</a>,
which documents their contents and sources. The census is also available at
<a href="https://manycast.net">manycast.net</a>. A new version is added every month.</p>
